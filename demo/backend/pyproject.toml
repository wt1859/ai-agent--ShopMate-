[project]
name = "ecommerce-customer-service-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
